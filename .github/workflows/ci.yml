# AGENT-SEC-W1, 30.09.2026: die Waechter laufen jetzt bei jedem Push.
#
# Das Audit vom 30.09.2026 hielt fest, dass fuenfzehn Testdateien mit 133 gruenen
# Tests im Repository lagen - und nichts sie ausfuehrte. Kein Workflow, kein
# Git-Hook, kein Buildschritt; `vercel.json` baut mit `build:web` und ruft weder
# `test` noch `check`. Betroffen war ausgerechnet der wichtigste Wallet-Waechter
# des Projekts, `R38 bis R42 der Client signiert nur und schreibt nichts`. Ein
# guter Waechter, der nie anschlug, weil ihn niemand startete.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    env:
      # Kein Geheimnis und keine echte Adresse: `src/db.mjs` wirft beim Import,
      # wenn diese beiden Variablen fehlen, und nimmt damit `alerts.test.mjs`
      # mit. Kein Test macht einen Netzaufruf - nachgewiesen ueber alle fuenfzehn
      # Dateien -, also genuegen zwei Attrappen. Eine .invalid-Domain kann per
      # RFC 2606 nicht aufloesen: faellt doch einmal ein echter Aufruf hinein,
      # scheitert er sofort, statt still irgendwohin zu gehen.
      SUPABASE_URL: https://example.invalid
      SUPABASE_SECRET_KEY: ci-dummy-not-a-real-key
    steps:
      # Auf Commit festgenagelt statt auf ein Tag: ein Tag laesst sich nachtraeglich
      # umhaengen, ein Commit nicht. v7 laeuft auf Node 24 (v4 auf dem
      # abgekuendigten Node 20, daher die Warnung in jedem Lauf).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Exakt, nicht '24': am 22.10.2026 loeste '24' auf v24.22.0 auf, unter
          # der Sicherheitsuntergrenze (NODE_UNTERGRENZE in
          # scripts/check-runtime-stack.mjs), und check:ci scheiterte zu Recht.
          # Fehlt die Version im Runner-Katalog, laedt setup-node sie von
          # nodejs.org. Wird die Untergrenze angehoben, hier mitziehen - beide Jobs.
          node-version: '24.22.1'
          cache: npm
      # Dieselbe Installation wie auf Vercel, damit CI und Deploy nicht
      # unterschiedliche Baeume pruefen.
      - run: npm ci --ignore-scripts
      # Die Sicherheitswaechter zuerst: schlaegt einer an, braucht der Rest
      # nicht mehr zu laufen.
      - run: npm run test:ci
      - run: npm run check:ci

  # CRSF Phase 2A (16.10.2026): Rahmenwerk-Selbsttest und Verifikation laufen bei
  # jedem Push mit, blockieren aber noch nicht (continue-on-error), bis der Pruefer
  # selbst Vertrauen gesammelt hat. Ohne Postgres zaehlen DB-Nachweise und
  # DB-Mutationen als NOT_RUN (fehlend), nie als bestanden. Der Job `pruefen`
  # oben bleibt unveraendert und allein massgeblich.
  crsf:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Dieselbe exakte Version wie im Job `pruefen`.
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run security:framework-test
      - run: npm run security:verify
